<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: url(#primaryGrad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .tagline-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }

    /* Subtle Non-Obtrusive Animations in Background */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(430px); opacity: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .pulse-orb-1 {
      transform-origin: 200px 100px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .pulse-orb-2 {
      transform-origin: 1000px 320px;
      animation: pulseGlow 10s ease-in-out infinite 2s;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .laser-scan {
      animation: scanline 7s linear infinite;
    }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dashMove 4s linear infinite;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Background Animated Glowing Orbs (Kept behind and away from center text) -->
  <g class="pulse-orb-1">
    <circle cx="180" cy="90" r="120" fill="#0284c7" opacity="0.18" filter="url(#softGlow)" />
  </g>
  <g class="pulse-orb-2">
    <circle cx="1020" cy="330" r="140" fill="#7c3aed" opacity="0.18" filter="url(#softGlow)" />
  </g>

  <!-- Animated Data Streams in Background (Non-intrusive) -->
  <path d="M 50 340 C 250 340, 350 390, 550 390 C 750 390, 850 350, 1150 350" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="stream-line" />
  <path d="M 50 60 C 300 60, 450 30, 700 30 C 950 30, 1050 70, 1150 70" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.25" class="stream-line" style="animation-direction: reverse;" />

  <!-- Floating Ambient Shield Particles (Background Aesthetics) -->
  <g class="particle" opacity="0.35">
    <polygon points="120,200 135,215 130,240 120,248 110,240 105,215" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="1080,140 1095,155 1090,180 1080,188 1070,180 1065,155" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Laser Scan Light Effect (Background) -->
  <line x1="100" y1="0" x2="1100" y2="0" stroke="url(#primaryGrad)" stroke-width="1" class="laser-scan" opacity="0.2" />

  <!-- Central Security Graphic Shield Motif (Behind Headline with high contrast) -->
  <g transform="translate(600, 105)">
    <!-- Central Shield Geometry -->
    <path d="M 0 -45 L 38 -25 L 38 18 C 38 42, 0 62, 0 62 C 0 62, -38 42, -38 18 L -38 -25 Z" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="2.5" filter="url(#glow)" />
    <!-- Lock / Keyhole Icon in Shield -->
    <path d="M -9 5 L -9 0 C -9 -5, -5 -9, 0 -9 C 5 -9, 9 -5, 9 0 L 9 5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <rect x="-12" y="5" width="24" height="18" rx="3" fill="#38bdf8" />
    <circle cx="0" cy="12" r="2.5" fill="#0f172a" />
    <line x1="0" y1="13.5" x2="0" y2="18" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Badge -->
  <g transform="translate(600, 190)">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-165" cy="0" r="4" fill="#38bdf8" />
    <text x="5" y="5" text-anchor="middle" class="badge-text">ENTERPRISE IRM &#8226; PERSISTENT EDRM &#8226; FILE SECURITY</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title (Sharp & Foregrounded) -->
  <text x="600" y="250" text-anchor="middle" class="title-text" filter="url(#glow)">Awesome Enterprise Document Security &amp; DRM</text>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <text x="600" y="295" text-anchor="middle" class="subtitle-text">Curated SaaS Platforms, Self-Hosted Vaults &amp; Cryptographic IRM Systems</text>

  <!-- FOREGROUND CONTENT: Tagline / Feature Highlights -->
  <text x="600" y="332" text-anchor="middle" class="tagline-text">Persistent Rights Control &#8226; Post-Delivery Revocation &#8226; Hardware Key Sealing &#8226; Dynamic Watermarking</text>

  <!-- Bottom Border Highlight -->
  <line x1="150" y1="418" x2="1050" y2="418" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" />
</svg>